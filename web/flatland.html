<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eaece3">
  <title>平面国 · W-Slice</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%232d665b' d='M20 2 38 12 20 22 2 12zm-18 16 18 10 18-10v8L20 38 2 26z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="flatland.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="返回回响庭院"><span class="brand-icon">◈</span><span>W–SLICE<span class="brand-sub">平面国</span></span></a>
    <nav aria-label="游戏设置">
      <button id="sound" class="icon-button" aria-pressed="true"><span aria-hidden="true">♫</span><span id="sound-label">声音开</span></button>
      <button id="collection" class="icon-button"><span id="collection-label">口袋里的秘密</span></button>
      <button id="style-toggle" class="icon-button">计分挑战</button>
      <button id="pause" class="icon-button">暂停 <kbd>Esc</kbd></button>
      <button id="restart" class="icon-button">同题重来 <kbd>R</kbd></button>
      <a class="icon-button" href="./">去庭院 ↗</a>
    </nav>
  </header>

  <main class="layout">
    <div class="heading">
      <div><p class="eyebrow">FLATLAND · 到处走走</p><h1 id="title">平面国</h1></div>
      <ol id="levels" class="levels" aria-label="关卡"></ol>
    </div>
    <p id="tagline" class="tagline"></p>
    <div class="scene-wrap">
      <canvas id="scene" role="img" tabindex="0" aria-label="平面世界与侧面"></canvas>
    </div>

    <section class="controls" aria-label="控制">
      <div class="control-guide">
        <div class="hint-slot">
          <span id="control-hint"></span>
          <div id="hint" class="hint" hidden aria-live="polite"></div>
        </div>
        <button id="fine-control" class="fine-button" aria-pressed="false">精调 <kbd>Shift</kbd></button>
      </div>
      <div id="slice-row" class="slice-row">
        <button id="s-down" class="hold-button" aria-label="降低">▼ <kbd>Q</kbd></button>
        <label for="s-slider" class="s-label"><b id="slice-axis">S</b></label>
        <input id="s-slider" type="range" min="0" max="6" step="0.005" value="0">
        <output id="s-value" for="s-slider">0.00</output>
        <button id="s-up" class="hold-button" aria-label="升高">▲ <kbd>E</kbd></button>
      </div>
      <div class="action-row">
        <div class="actions">
          <button id="peek" class="action-button" hidden aria-pressed="false">按住俯视 <kbd>Space</kbd></button>
          <button id="reveal" class="action-button" hidden>偷看侧面 <kbd>V</kbd></button>
          <button id="rotate-key" class="action-button" hidden>转动 <kbd>Space</kbd></button>
          <button id="flip-key" class="action-button accent" hidden>翻面 <kbd>F</kbd></button>
          <button id="probe-direction" class="action-button" aria-keyshortcuts="C" hidden><span id="probe-direction-label">跳向上层 ↑</span> <kbd>C</kbd></button>
          <button id="pet" class="action-button" hidden><span id="pet-label">一起玩</span> <kbd>B</kbd></button>
          <button id="poke" class="action-button" hidden>戳一下 <kbd>Space</kbd></button>
          <button id="explore-next" class="action-button accent" hidden>下一站 ↗</button>
          <a id="explore-courtyard" class="action-button" href="./" hidden>去庭院 ↗</a>
        </div>
        <ul id="stars" class="stars" aria-label="星级条件"></ul>
        <div class="clock"><span id="timer">0.0</span><small id="par"></small></div>
      </div>
      <p id="companion-hint" class="companion-hint" hidden></p>
      <p id="garden-progress" class="companion-hint" hidden></p>
    </section>
  </main>
  <div class="sr-only" id="announcement" role="status" aria-live="polite"></div>

  <dialog id="collection-dialog" class="dialog collection-dialog" aria-labelledby="collection-title">
    <div class="collection-heading"><div><p class="eyebrow">遇见以后，就一起走</p><h2 id="collection-title">口袋里的朋友</h2></div><button id="collection-close" class="text-button" aria-label="合上口袋">×</button></div>
    <div id="friend-cards" class="friend-cards"></div>
    <p id="garden-tally" class="companion-hint"></p>
    <div id="garden-memories" class="garden-memories" aria-label="已点亮的花园"></div>
    <div class="collection-footer"><p id="collection-caption"></p><button id="travel-together" class="primary-button" aria-pressed="false" disabled>一起出门 ♧ ✦ ❧</button></div>
    <p id="garden-keepsake" class="garden-keepsake" hidden>✿ 六座花园全部盛开 ✿<br><small>给一起走过每一层的我们 · 花冠会陪朋友去庭院</small></p>
  </dialog>

  <dialog id="intro-dialog" class="dialog">
    <p class="eyebrow" id="intro-kicker">LEVEL 1</p><h2 id="intro-title"></h2><p id="intro-text" class="intro-text"></p>
    <ul id="intro-stars" class="stars compact"></ul>
    <p id="intro-controls" class="intro-controls"></p>
    <p id="intro-best" class="best-line"></p>
    <button id="start" class="primary-button">开始 <kbd>Enter</kbd></button>
  </dialog>
  <dialog id="result-dialog" class="dialog result">
    <div id="result-stars" class="result-stars" aria-hidden="true"></div>
    <h2 id="result-title"></h2>
    <div class="result-score"><strong id="result-score">0</strong><span id="result-record" class="record" hidden>新纪录</span></div>
    <p id="result-best" class="best-line"></p>
    <ul id="result-list" class="stars compact"></ul>
    <p id="result-stats" class="result-stats"></p>
    <p id="result-comparison" class="comparison"></p>
    <div class="dialog-actions"><button id="retry" class="secondary-button">同题重来 <kbd>R</kbd></button><button id="next" class="primary-button">下一关 <kbd>Enter</kbd></button><a id="enter-courtyard" class="primary-button" href="./?from=flatland" hidden>进入庭院 ↗</a></div>
    <div class="dialog-actions secondary-actions"><button id="new-challenge" class="text-button">换一题 ↻</button><button id="choose-level" class="text-button">选关</button></div>
    <p id="result-challenge" class="best-line challenge-line"></p>
  </dialog>
  <dialog id="pause-dialog" class="dialog pause-dialog" aria-labelledby="pause-title">
    <p class="eyebrow">TAKE A BREATH</p><h2 id="pause-title">已暂停</h2>
    <p class="intro-text">时间与危险都停在这里。</p>
    <div class="dialog-actions"><button id="resume" class="primary-button">继续 <kbd>Esc</kbd></button><button id="pause-retry" class="secondary-button">同题重来</button></div>
    <div class="dialog-actions secondary-actions"><button id="pause-new" class="text-button">换一题 ↻</button></div>
  </dialog>
  <script type="module" src="src/flatland/main.js"></script>
</body>
</html>

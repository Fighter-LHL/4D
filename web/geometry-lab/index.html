<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060a14">
  <meta name="description" content="一个关于第四维的网页小游戏：你只能看见一层。">
  <title>W / SLICE · 你只能看见一层</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23070b16'/%3E%3Cpath d='m12 18 8 28 12-22 12 22 8-28' fill='none' stroke='%23bdb8ff' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section id="title-screen" class="screen title-screen" aria-labelledby="wordmark">
    <div class="title-art" aria-hidden="true">
      <div class="stack">
        <span class="layer l0"></span><span class="layer l1"></span><span class="layer l2"></span><span class="layer l3"></span><span class="layer l4"></span>
        <span class="slice"><i class="slice-dot"></i></span>
      </div>
    </div>
    <div class="title-copy">
      <p class="kicker">A SMALL GAME ABOUT THE FOURTH DIMENSION</p>
      <h1 id="wordmark" class="wordmark">W<span>/</span>SLICE</h1>
      <p class="tagline">你只能看见一层。<br>学会换一层，就能走出没有门的房间。</p>
      <button id="play" class="primary big">开始 <span aria-hidden="true">→</span></button>
      <p class="title-note">约 10 分钟 · 键盘或触屏 · 无需安装</p>
    </div>
    <nav id="chapter-list" class="chapter-list" aria-label="章节与关卡"></nav>
  </section>

  <section id="game-screen" class="screen game-screen" hidden>
    <header class="topbar">
      <button id="back" class="ghost" aria-label="返回章节">← <span class="hide-narrow">章节</span></button>
      <div class="level-id"><span id="level-chapter"></span><b id="level-title"></b></div>
      <div class="topbar-right">
        <span id="stats" class="stats" aria-live="off"></span>
        <button id="hint" class="ghost">提示 <span id="hint-count"></span></button>
        <button id="sound" class="ghost icon" aria-pressed="true" aria-label="音效开关" title="音效">♪</button>
      </div>
    </header>

    <main class="play">
      <div class="stage" id="stage">
        <canvas id="scene" tabindex="0" aria-label="你的世界：当前的三维截面"></canvas>
        <canvas id="flat" tabindex="0" aria-label="你的世界：二维的一层" hidden></canvas>
        <div class="stage-tag"><i class="live"></i><span id="stage-tag">你的世界</span></div>
        <p class="objective" id="objective"></p>
        <p class="toast" id="toast" role="status" aria-live="polite"></p>
        <button id="reset-view" class="ghost icon corner" aria-label="重置视角" title="重置视角">↺</button>
        <div class="empty-notice" id="empty-notice" hidden><span class="empty-ring"></span><p>这一层，什么都没有碰到。</p></div>
        <div class="dpad" id="dpad" hidden aria-label="移动光点">
          <button data-dir="ArrowUp" class="d-up" aria-label="向前">▲</button><button data-dir="ArrowLeft" class="d-left" aria-label="向左">◀</button><button data-dir="ArrowRight" class="d-right" aria-label="向右">▶</button><button data-dir="ArrowDown" class="d-down" aria-label="向后">▼</button>
        </div>
        <div class="render-error" id="render-error" role="alert" hidden>当前浏览器无法显示三维画面。请使用支持 WebGL 的浏览器并开启硬件加速。</div>
        <div class="card-layer" id="card-layer" hidden>
          <div class="card" role="dialog" aria-modal="true" aria-labelledby="card-title">
            <p class="card-kicker" id="card-kicker"></p>
            <h2 id="card-title"></h2>
            <p class="card-body" id="card-body"></p>
            <code class="card-formula" id="card-formula" hidden></code>
            <p class="card-stats" id="card-stats" hidden></p>
            <div class="card-actions" id="card-actions"></div>
          </div>
        </div>
      </div>

      <aside class="side">
        <section class="map-panel" aria-labelledby="map-title">
          <div class="map-head"><b id="map-title">全貌</b><small id="map-sub"></small></div>
          <div class="map-body">
            <div class="map-view">
              <canvas id="map" aria-label="地图：整个关卡的全貌，竖直方向是隐藏的那一维"></canvas>
              <div class="map-veil" id="map-veil" hidden><p>地图已收起<br><small>只靠你看到的这一片</small></p><button id="peek" class="ghost">窥视 5 秒</button></div>
              <div class="map-error" id="map-error" hidden>地图需要 WebGL</div>
            </div>
            <div class="rail" id="w-rail" role="slider" tabindex="0" aria-orientation="vertical" aria-label="切换层" aria-valuemin="-2" aria-valuemax="2" aria-valuenow="0">
              <span class="rail-label" id="rail-top">+W</span>
              <div class="rail-track" id="rail-track">
                <span class="band b4"></span><span class="band b3"></span><span class="band b2"></span><span class="band b1"></span><span class="band b0"></span>
                <span class="rail-target" id="rail-target" hidden></span>
                <span class="rail-thumb" id="rail-thumb"></span>
              </div>
              <span class="rail-label" id="rail-bottom">−W</span>
            </div>
          </div>
          <div class="layer-readout"><i class="swatch" id="layer-swatch"></i><span id="layer-name"></span><span class="w-value" id="w-value"></span></div>
        </section>

        <section class="predict" id="predict" hidden aria-labelledby="predict-question">
          <div class="predict-top"><span class="kicker">先猜，再看</span><span id="predict-count"></span></div>
          <h2 id="predict-question"></h2>
          <div class="choices" role="group" aria-label="你的预测">
            <button data-choice="appear" aria-pressed="false"><i>◌</i>出现</button><button data-choice="grow" aria-pressed="false"><i>↗</i>变大</button><button data-choice="shrink" aria-pressed="false"><i>↘</i>变小</button><button data-choice="disappear" aria-pressed="false"><i>╌</i>消失</button><button data-choice="same" aria-pressed="false"><i>＝</i>不变</button>
          </div>
          <p class="predict-feedback" id="predict-feedback" role="status" hidden></p>
          <button id="reveal" class="primary" disabled>看看结果 <span aria-hidden="true">→</span></button>
          <button id="next-trial" class="primary" hidden>下一题 <span aria-hidden="true">→</span></button>
        </section>

        <p class="keys" id="keys"></p>
      </aside>
    </main>
  </section>

  <noscript><p class="noscript">请启用 JavaScript 来玩这个游戏。</p></noscript>
  <script type="module" src="./app.mjs"></script>
</body>
</html>

name: Web Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-test.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-test.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix web test

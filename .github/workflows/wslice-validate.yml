name: W-Slice Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'WSliceProto/**'
      - 'scripts/**'
      - '.github/workflows/wslice-validate.yml'
  pull_request:
    paths:
      - 'WSliceProto/**'
      - 'scripts/**'
      - '.github/workflows/wslice-validate.yml'

permissions:
  contents: read

jobs:
  evidence-checker:
    name: Evidence checker tests (no Unity required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: bash -n scripts/validate-local.sh

  validation:
    name: L0 compile + L1 scene validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      EVIDENCE: WSliceProto/TestResults/ci-${{ github.run_id }}-${{ github.run_attempt }}-validation
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Report unavailable Unity configuration
        if: ${{ env.UNITY_LICENSE == '' || env.UNITY_EMAIL == '' || env.UNITY_PASSWORD == '' }}
        run: echo 'Unity L0/L1 SKIPPED — license configuration unavailable; no Unity validation was performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Mark this invocation
        if: ${{ env.UNITY_LICENSE != '' && env.UNITY_EMAIL != '' && env.UNITY_PASSWORD != '' }}
        run: |
          mkdir -p "$EVIDENCE"
          touch "$EVIDENCE/started"
      - name: Run the unified Editor validator
        id: validation
        if: ${{ env.UNITY_LICENSE != '' && env.UNITY_EMAIL != '' && env.UNITY_PASSWORD != '' }}
        uses: game-ci/unity-builder@v4
        with:
          projectPath: WSliceProto
          unityVersion: 6000.0.77f1
          targetPlatform: StandaloneLinux64
          versioning: None
          buildMethod: WSlice.Editor.WSliceValidationRunner.ValidateAll
          customParameters: -wsliceValidationReport TestResults/ci-${{ github.run_id }}-${{ github.run_attempt }}-validation/validation.json
      - name: Require a complete fresh validation receipt
        if: ${{ always() && steps.validation.outcome != 'skipped' && steps.validation.outcome != '' }}
        run: python3 scripts/verify_unity_results.py "$EVIDENCE/validation.json" --kind validation --started-after "$EVIDENCE/started"
      - name: Preserve validation evidence
        if: ${{ always() && steps.validation.outcome != 'skipped' && steps.validation.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE }}
            WSliceProto/Logs
          if-no-files-found: error

  tests:
    name: Unity ${{ matrix.testMode }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      EVIDENCE: WSliceProto/TestResults/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.testMode }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Report unavailable Unity configuration
        if: ${{ env.UNITY_LICENSE == '' || env.UNITY_EMAIL == '' || env.UNITY_PASSWORD == '' }}
        run: echo 'Unity ${{ matrix.testMode }} SKIPPED — license configuration unavailable; no tests were run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Mark this invocation
        if: ${{ env.UNITY_LICENSE != '' && env.UNITY_EMAIL != '' && env.UNITY_PASSWORD != '' }}
        run: |
          mkdir -p "$EVIDENCE"
          touch "$EVIDENCE/started"
      - name: Run Unity tests
        id: tests
        if: ${{ env.UNITY_LICENSE != '' && env.UNITY_EMAIL != '' && env.UNITY_PASSWORD != '' }}
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: WSliceProto
          unityVersion: 6000.0.77f1
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ env.EVIDENCE }}/results
          coverageEnabled: false
          githubToken: ''
      - name: Require fresh completed NUnit cases
        if: ${{ always() && steps.tests.outcome != 'skipped' && steps.tests.outcome != '' }}
        run: python3 scripts/verify_unity_results.py "$EVIDENCE/results" --started-after "$EVIDENCE/started"
      - name: Preserve test evidence
        if: ${{ always() && steps.tests.outcome != 'skipped' && steps.tests.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.testMode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
